<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم - مركز المحتوى</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-spinner"></div>
      <p class="loading-text">جاري تحميل المحتوى...</p>
    </div>

    <nav class="navbar">
      <div class="nav-container">
        <h1 class="logo">مركز المحتوى - المدير</h1>
        <button id="logoutBtn" class="btn-secondary">تسجيل الخروج</button>
      </div>
    </nav>

    <main class="admin-container">
      <div class="admin-sidebar">
        <button class="tab-btn active" data-tab="articles">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          المقالات
        </button>
        <button class="tab-btn" data-tab="videos">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          الفيديوهات
        </button>
      </div>

      <div class="admin-content">
        <!-- Articles Tab -->
        <div class="tab-content active" id="articlesTab">
          <h2>إضافة مقال جديد</h2>
          <form id="articleForm" class="content-form">
            <div class="input-group">
              <label for="articleTitle">عنوان المقال</label>
              <input type="text" id="articleTitle" required placeholder="أدخل عنوان المقال" />
            </div>

            <div class="input-group">
              <label for="articleAuthor">الكاتب</label>
              <input type="text" id="articleAuthor" required placeholder="أدخل اسم الكاتب" />
            </div>

            <div class="input-group">
              <label for="articleCategory">التصنيف</label>
              <select id="articleCategory" required>
                <option value="">اختر التصنيف</option>
                <option value="تكنولوجيا">تكنولوجيا</option>
                <option value="أعمال">أعمال</option>
                <option value="علوم">علوم</option>
                <option value="نمط حياة">نمط حياة</option>
                <option value="صحة">صحة</option>
              </select>
            </div>

            <div class="input-group">
              <label for="articleImage">رابط الصورة</label>
              <input type="url" id="articleImage" placeholder="https://example.com/image.jpg" />
            </div>

            <div class="input-group">
              <label for="articleContent">المحتوى</label>
              <textarea id="articleContent" rows="8" required placeholder="اكتب محتوى المقال هنا..."></textarea>
            </div>

            <button type="submit" class="btn-primary">نشر المقال</button>
          </form>

          <div class="content-list">
            <h3>المقالات المنشورة</h3>
            <div id="articlesList"></div>
          </div>
        </div>

        <!-- Videos Tab -->
        <div class="tab-content" id="videosTab">
          <h2>إضافة فيديو جديد</h2>
          <form id="videoForm" class="content-form">
            <div class="input-group">
              <label for="videoTitle">عنوان الفيديو</label>
              <input type="text" id="videoTitle" required placeholder="أدخل عنوان الفيديو" />
            </div>

            <div class="input-group">
              <label for="videoCreator">صانع المحتوى</label>
              <input type="text" id="videoCreator" required placeholder="أدخل اسم صانع المحتوى" />
            </div>

            <div class="input-group">
              <label for="videoCategory">التصنيف</label>
              <select id="videoCategory" required>
                <option value="">اختر التصنيف</option>
                <option value="تكنولوجيا">تكنولوجيا</option>
                <option value="تعليم">تعليم</option>
                <option value="ترفيه">ترفيه</option>
                <option value="دروس">دروس</option>
                <option value="أخبار">أخبار</option>
              </select>
            </div>

            <div class="input-group">
              <label for="videoUploadMethod">طريقة الرفع</label>
              <select id="videoUploadMethod" required onchange="toggleVideoUploadMethod()">
                <option value="">اختر طريقة الرفع</option>
                <option value="url">رابط YouTube/Vimeo</option>
                <option value="upload">رفع ملف فيديو</option>
              </select>
            </div>

            <!-- URL Upload Method -->
            <div id="urlUploadMethod" style="display: none">
              <div class="input-group">
                <label for="videoUrl">رابط الفيديو (YouTube/Vimeo)</label>
                <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />
              </div>
            </div>

            <!-- File Upload Method -->
            <div id="fileUploadMethod" style="display: none">
              <div class="input-group">
                <label>رفع ملف الفيديو (Cloudinary - 25GB مجاني)</label>
                <button type="button" id="uploadCloudinaryBtn" class="btn-secondary" style="width: 100%; margin-top: 10px">
                  📤 اختر فيديو من جهازك
                </button>
                <input type="hidden" id="uploadedVideoUrl" />
                <div
                  id="uploadSuccess"
                  style="display: none; margin-top: 10px; padding: 10px; background: #d1fae5; border-radius: 6px; color: #065f46"
                >
                  ✅ تم رفع الفيديو بنجاح!
                </div>
                <p style="font-size: 0.75rem; color: #64748b; margin-top: 5px">
                  * 25GB تخزين مجاني | رابط دائم | مجاني 100% بدون بطاقة ائتمان
                </p>
              </div>
            </div>

            <div class="input-group">
              <label for="videoThumbnail">رابط الصورة المصغرة</label>
              <input type="url" id="videoThumbnail" placeholder="https://example.com/thumbnail.jpg" />
            </div>

            <div class="input-group">
              <label for="videoDescription">الوصف</label>
              <textarea id="videoDescription" rows="6" required placeholder="أدخل وصف الفيديو..."></textarea>
            </div>

            <button type="submit" class="btn-primary">نشر الفيديو</button>
          </form>

          <div class="content-list">
            <h3>الفيديوهات المنشورة</h3>
            <div id="videosList"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
    <script>
      // Check if user is admin
      if (localStorage.getItem("userRole") !== "admin") {
        window.location.href = "index.html";
      }

      // Tab switching
      const tabButtons = document.querySelectorAll(".tab-btn");
      const tabContents = document.querySelectorAll(".tab-content");

      tabButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const tabName = btn.dataset.tab;

          tabButtons.forEach((b) => b.classList.remove("active"));
          tabContents.forEach((c) => c.classList.remove("active"));

          btn.classList.add("active");
          document.getElementById(tabName + "Tab").classList.add("active");
        });
      });

      // Firebase Storage Configuration (FREE Spark Plan - 1GB Storage!)
      // Custom Server Configuration
      // Change this to your deployed server URL after hosting
      const SERVER_URL = ""; // Empty string means same server

      // Upload video to custom server
      async function uploadVideoToServer(file) {
        if (!file) {
          alert("الرجاء اختيار ملف فيديو");
          return null;
        }

        // 500MB max (server limit)
        const maxSize = 500 * 1024 * 1024;
        if (file.size > maxSize) {
          alert("حجم الفيديو كبير جداً! الحد الأقصى: 500MB");
          return null;
        }

        const progressDiv = document.getElementById("uploadProgress");
        const progressBar = document.getElementById("uploadProgressBar");
        const statusText = document.getElementById("uploadStatusText");
        const successDiv = document.getElementById("uploadSuccess");

        try {
          progressDiv.style.display = "block";
          successDiv.style.display = "none";
          statusText.textContent = "جاري رفع الفيديو... 0%";

          const formData = new FormData();
          formData.append("video", file);

          const xhr = new XMLHttpRequest();

          return new Promise((resolve, reject) => {
            // Progress tracking
            xhr.upload.addEventListener("progress", (e) => {
              if (e.lengthComputable) {
                const percentComplete = (e.loaded / e.total) * 100;
                progressBar.style.width = percentComplete + "%";
                statusText.textContent = `جاري الرفع... ${Math.round(percentComplete)}%`;
              }
            });

            xhr.addEventListener("load", () => {
              if (xhr.status === 200 || xhr.status === 201) {
                try {
                  const response = JSON.parse(xhr.responseText);
                  console.log("Server response:", response);

                  if (response.success && response.data && response.data.url) {
                    const videoUrl = response.data.url;
                    progressDiv.style.display = "none";
                    successDiv.style.display = "block";
                    resolve(videoUrl);
                  } else {
                    reject(new Error("فشل الرفع: " + (response.error || "خطأ غير معروف")));
                  }
                } catch (e) {
                  reject(new Error("فشل في قراءة الرد: " + e.message));
                }
              } else {
                reject(new Error(`خطأ في الرفع: ${xhr.status}`));
              }
            });

            xhr.addEventListener("error", () => {
              reject(new Error("فشل الاتصال بالخادم"));
            });

            xhr.open("POST", `${SERVER_URL}/upload`);
            xhr.send(formData);
          });
        } catch (error) {
          progressDiv.style.display = "none";
          console.error("Upload error:", error);
          alert("فشل في رفع الفيديو: " + error.message);
          return null;
        }
      }

      // Handle upload button click
      document.addEventListener("DOMContentLoaded", () => {
        const uploadBtn = document.getElementById("uploadVideoBtn");
        if (uploadBtn) {
          uploadBtn.addEventListener("click", async () => {
            const fileInput = document.getElementById("videoFileInput");
            const file = fileInput.files[0];

            if (!file) {
              alert("الرجاء اختيار ملف فيديو أولاً");
              return;
            }

            const videoUrl = await uploadVideoToServer(file);
            if (videoUrl) {
              document.getElementById("uploadedVideoUrl").value = videoUrl;
              console.log("Video uploaded to Firebase:", videoUrl);
            }
          });
        }
      });

      // Toggle upload method
      window.toggleVideoUploadMethod = function () {
        const method = document.getElementById("videoUploadMethod").value;
        const urlMethod = document.getElementById("urlUploadMethod");
        const fileMethod = document.getElementById("fileUploadMethod");
        const uploadSuccess = document.getElementById("uploadSuccess");
        const uploadedUrl = document.getElementById("uploadedVideoUrl");

        if (method === "url") {
          urlMethod.style.display = "block";
          fileMethod.style.display = "none";
          uploadSuccess.style.display = "none";
          uploadedUrl.value = "";
          document.getElementById("videoUrl").required = true;
        } else if (method === "upload") {
          urlMethod.style.display = "none";
          fileMethod.style.display = "block";
          uploadSuccess.style.display = "none";
          uploadedUrl.value = "";
          document.getElementById("videoUrl").required = false;
        } else {
          urlMethod.style.display = "none";
          fileMethod.style.display = "none";
          uploadSuccess.style.display = "none";
          uploadedUrl.value = "";
        }
      };

      // Logout functionality
      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("userRole");
        window.location.href = "index.html";
      });

      // Article form submission
      document.getElementById("articleForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const article = {
          id: Date.now(),
          title: document.getElementById("articleTitle").value,
          author: document.getElementById("articleAuthor").value,
          category: document.getElementById("articleCategory").value,
          image: document.getElementById("articleImage").value || "https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=800",
          content: document.getElementById("articleContent").value,
          date: new Date().toLocaleDateString(),
        };

        await saveArticle(article);
        e.target.reset();
        await displayArticles();
        alert("تم نشر المقال بنجاح!");
      });

      // Video form submission
      document.getElementById("videoForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const uploadMethod = document.getElementById("videoUploadMethod").value;
        let videoUrl = "";

        if (uploadMethod === "url") {
          videoUrl = document.getElementById("videoUrl").value;
          if (!videoUrl) {
            alert("الرجاء إدخال رابط الفيديو");
            return;
          }
        } else if (uploadMethod === "upload") {
          videoUrl = document.getElementById("uploadedVideoUrl").value;
          if (!videoUrl) {
            alert("الرجاء رفع ملف الفيديو أولاً");
            return;
          }
        } else {
          alert("الرجاء اختيار طريقة الرفع");
          return;
        }

        const video = {
          id: Date.now(),
          title: document.getElementById("videoTitle").value,
          creator: document.getElementById("videoCreator").value,
          category: document.getElementById("videoCategory").value,
          url: videoUrl,
          thumbnail: document.getElementById("videoThumbnail").value || "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=800",
          description: document.getElementById("videoDescription").value,
          date: new Date().toLocaleDateString(),
          isUploaded: uploadMethod === "upload",
        };

        await saveVideo(video);
        e.target.reset();
        document.getElementById("videoUploadMethod").value = "";
        document.getElementById("urlUploadMethod").style.display = "none";
        document.getElementById("fileUploadMethod").style.display = "none";
        document.getElementById("uploadSuccess").style.display = "none";
        document.getElementById("uploadedVideoUrl").value = "";
        await displayVideos();
        alert("تم نشر الفيديو بنجاح!");
      });

      // Display articles
      async function displayArticles() {
        const articles = await getArticles();
        const articlesList = document.getElementById("articlesList");

        if (articles.length === 0) {
          articlesList.innerHTML = '<p class="empty-message">لم يتم نشر أي مقالات بعد.</p>';
          return;
        }

        articlesList.innerHTML = articles
          .map(
            (article) => `
                <div class="content-item">
                    <div class="content-item-info">
                        <h4>${article.title}</h4>
                        <p><strong>الكاتب:</strong> ${article.author} | <strong>التصنيف:</strong> ${article.category}</p>
                        <p class="content-date">${article.date}</p>
                    </div>
                    <button class="btn-delete" onclick="deleteArticleAdmin(${article.id})">حذف</button>
                </div>
            `,
          )
          .join("");
      }

      // Display videos
      async function displayVideos() {
        const videos = await getVideos();
        const videosList = document.getElementById("videosList");

        if (videos.length === 0) {
          videosList.innerHTML = '<p class="empty-message">لم يتم نشر أي فيديوهات بعد.</p>';
          return;
        }

        videosList.innerHTML = videos
          .map(
            (video) => `
                <div class="content-item">
                    <div class="content-item-info">
                        <h4>${video.title}</h4>
                        <p><strong>صانع المحتوى:</strong> ${video.creator} | <strong>التصنيف:</strong> ${video.category}</p>
                        <p class="content-date">${video.date}</p>
                    </div>
                    <button class="btn-delete" onclick="deleteVideoAdmin(${video.id})">حذف</button>
                </div>
            `,
          )
          .join("");
      }

      // Delete functions
      window.deleteArticleAdmin = async function (id) {
        if (confirm("هل أنت متأكد من حذف هذا المقال؟")) {
          await deleteArticle(id);
          await displayArticles();
        }
      };

      window.deleteVideoAdmin = async function (id) {
        if (confirm("هل أنت متأكد من حذف هذا الفيديو؟")) {
          await deleteVideo(id);
          await displayVideos();
        }
      };

      // Initial display - wait for Firebase to initialize
      async function initializeAdminPage() {
        try {
          // Wait a bit for Firebase to initialize
          await new Promise((resolve) => setTimeout(resolve, 500));
          await displayArticles();
          await displayVideos();
        } catch (error) {
          console.error("Error loading content:", error);
        } finally {
          // Hide loading screen
          const loadingScreen = document.getElementById("loadingScreen");
          loadingScreen.classList.add("hidden");
        }
      }

      initializeAdminPage();
    </script>
  </body>
</html>
